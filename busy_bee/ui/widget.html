<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>busy-bee widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Icon is sized well below 100% of the window so the float
       animation (translate + rotate) has real room to move without
       clipping against the window edge (overflow: hidden on body).
       History: 80% clipped; 62% (with transform-origin below center)
       still got reported as clipped at the top (antennae) specifically
       -- verified no clipping two different ways (pixel-scanning the
       rendered PNG's actual alpha channel, and sampling
       getBoundingClientRect() across the animation cycle) but couldn't
       get a live screenshot to fully confirm, so this is belt-and-
       suspenders: transform-origin moved to dead center (a pivot below
       center, 65%, meant the top -- exactly where antennae are --
       swings *farther* than the bottom during rotation, which lines up
       exactly with "top gets cut off"), icon shrunk further to 55%,
       and the animation amplitude trimmed again too. */
    #icon {
      width: 55%;
      height: 55%;
      display: block;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      animation: bee-float 2.6s ease-in-out infinite;
      transform-origin: 50% 50%;
    }

    @keyframes bee-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%      { transform: translateY(-2px) rotate(-4deg); }
      50%      { transform: translateY(-1px) rotate(0deg); }
      75%      { transform: translateY(-2px) rotate(4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #icon { animation: none; }
    }
  </style>
</head>
<body>
  <img id="icon" draggable="false" />
  <script src="widget.js"></script>
</body>
</html>
