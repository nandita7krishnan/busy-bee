<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>busy-bee widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Icon is sized well below 100% of the window so the float
       animation (translate + rotate) has real room to move without
       clipping against the window edge (overflow: hidden on body) --
       80% was tried first and still clipped: rotating a ~77px box a
       few degrees around an off-center pivot swings its top corner
       several px sideways, on top of the translateY, which used up
       more than the ~9.5px margin 80% left on each side. 62% leaves
       roughly double that. */
    #icon {
      width: 62%;
      height: 62%;
      display: block;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      animation: bee-float 2.6s ease-in-out infinite;
      transform-origin: 50% 65%;
    }

    @keyframes bee-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%      { transform: translateY(-3px) rotate(-5deg); }
      50%      { transform: translateY(-1px) rotate(0deg); }
      75%      { transform: translateY(-3px) rotate(5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #icon { animation: none; }
    }
  </style>
</head>
<body>
  <img id="icon" draggable="false" />
  <script src="widget.js"></script>
</body>
</html>
