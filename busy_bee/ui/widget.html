<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>busy-bee widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #icon {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <img id="icon" draggable="false" />
  <script src="widget.js"></script>
</body>
</html>
